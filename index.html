<style>
:root{
  --bg:#101217;--card:#1b1e27;--card2:#1e222c;--border:#2a2e38;--accent:#ff3b30;--accent2:#ff5a4e;
  --amber:#f5a623;--text:#eef0f4;--muted:#9aa0ac;--blue:#6fa8ff;--green:#63d69a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:0;}
p{margin:0;line-height:1.45;color:var(--muted);font-size:13.5px;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}
#root{max-width:520px;margin:0 auto;padding-bottom:78px;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:5;background:#101217;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--border);}
.brand{font-family:'Oswald';font-weight:700;font-size:15px;letter-spacing:1px;margin-bottom:8px;}
.brand span{color:var(--accent);}
.page{padding:6px 16px 20px;}
.eyebrow{color:var(--accent);font-size:10.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.h2{font-size:16px;}
.lede{font-size:13px;margin-bottom:14px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 15px;margin-bottom:12px;}
.card h3{font-size:13.5px;margin-bottom:8px;color:#fff;}
.tag{color:var(--muted);font-size:10.5px;text-transform:none;letter-spacing:0;font-weight:500;}
/* progress bar (sticky, always visible) */
.phasebar{display:flex;gap:4px;margin-bottom:3px;}
.pseg{flex:1;height:8px;border-radius:5px;background:var(--card2);border:1px solid var(--border);overflow:hidden;}
.pseg i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:5px;}
.plabels{display:flex;gap:4px;}
.plabels span{flex:1;text-align:center;font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.plabels span.cur{color:var(--accent2);font-weight:700;}
.bignum{font-family:'Oswald';font-size:30px;font-weight:700;}
.statrow{display:flex;gap:10px;margin-bottom:12px;}
.stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
.stat .lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
/* nav buttons (home menu) */
.navbtn{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;width:100%;text-align:left;color:var(--text);}
.navbtn .ic{font-size:22px;}
.navbtn b{display:block;font-family:'Oswald';font-size:15px;text-transform:uppercase;letter-spacing:.5px;}
.navbtn span{font-size:11.5px;color:var(--muted);}
.navbtn.accent{border-color:#4a2226;background:#211316;}
.navbtn.blue{border-color:#263049;background:#161b26;}
.navbtn.info{border-color:#264034;background:#12211c;}
/* checklist */
ul.check{list-style:none;padding:0;margin:0;}
ul.check li{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid #23262f;}
ul.check li:last-child{border-bottom:none;}
.box{flex:0 0 20px;height:20px;border-radius:5px;border:1.5px solid #565a66;margin-top:1px;display:flex;align-items:center;justify-content:center;background:transparent;}
.box.on{background:var(--accent);border-color:var(--accent);}
.box.on:after{content:'✓';color:#fff;font-size:12px;font-weight:700;}
.itxt{flex:1;font-size:13px;color:var(--text);line-height:1.3;}
.itxt.done{color:var(--muted);text-decoration:line-through;}
.itxt a{text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:2px;}
.docli{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid #23262f;}
.docli:last-child{border-bottom:none;}
.docic{font-size:14px;flex:0 0 20px;text-align:center;}
/* dual checkbox (practiced / mastered) */
li.duali{display:block;padding:9px 0;border-bottom:1px solid #23262f;}
li.duali:last-child{border-bottom:none;}
li.duali .itxt{margin-bottom:6px;}
.dgroup{display:flex;gap:8px;}
.dchip{flex:1;border-radius:8px;border:1.3px solid var(--border);background:var(--card2);color:var(--muted);font-size:11px;font-weight:600;padding:7px 4px;text-align:center;letter-spacing:.3px;}
.dchip.pr.on{background:#16233a;border-color:var(--blue);color:var(--blue);}
.dchip.ma.on{background:#123324;border-color:var(--green);color:var(--green);}
/* chop / test stepper */
.chop{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #23262f;gap:8px;}
.chop:last-child{border-bottom:none;}
.chop .nm{font-size:12px;line-height:1.3;}
.chop .nm b{display:block;font-size:9.5px;color:var(--muted);font-weight:500;}
.stepper{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.stepper button{width:26px;height:26px;border-radius:7px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:14px;line-height:1;}
.stepper .lvl{font-family:'Oswald';font-size:14px;min-width:34px;text-align:center;}
.lvl.hit{color:var(--green);}
/* daily blocks */
.blk{border-left:3px solid var(--accent);background:var(--card);border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:10px;}
.blk.done-today{border-left-color:var(--green);}
.blk .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.blk .nm{font-family:'Oswald';font-weight:700;font-size:13.5px;text-transform:uppercase;}
.blk .min{font-size:10.5px;color:var(--muted);}
.blk .markrow{margin-top:8px;}
.blk .markrow li{border-bottom:none;padding:4px 0 0;}
.blk .markrow .itxt{font-size:11.5px;color:var(--muted);}
/* day picker */
.daypick{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;}
.dchip2{flex:0 0 auto;padding:7px 12px;border-radius:9px;background:var(--card2);border:1px solid var(--border);color:var(--muted);font-size:11.5px;font-weight:700;}
.dchip2.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.dchip2.istoday:after{content:'•';margin-left:3px;}
/* bottom nav */
.botnav{position:fixed;bottom:0;left:0;right:0;background:#15171e;border-top:1px solid var(--border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;}
.botnav button{flex:1;background:none;border:none;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.3px;padding:6px 1px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;border-radius:8px;}
.botnav button .ic{font-size:16px;}
.botnav button.active{color:var(--accent2);}
/* misc */
.note{border-left:3px solid var(--amber);background:#241f14;padding:10px 12px;border-radius:0 10px 10px 0;font-size:12px;color:#e6d9b8;margin-bottom:12px;}
.tbtn{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:600;}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.tbtn.danger{background:#2a1214;border-color:#5c1f22;color:#ff8a80;}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 18px;border-radius:30px;font-size:12.5px;font-weight:600;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.acc{margin-bottom:10px;}
.acchead{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.acchead b{font-family:'Oswald';font-size:13px;text-transform:uppercase;}
.accbody{padding:10px 4px 2px;}
.chev{color:var(--muted);font-size:11px;transition:transform .2s;}
.chev.open{transform:rotate(90deg);}
.select{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 8px;font-size:12px;font-family:inherit;width:100%;margin-top:6px;}
table.info{width:100%;border-collapse:collapse;}
table.info th{text-align:left;font-size:9px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding:4px 4px;}
table.info td{font-size:11.5px;color:var(--text);padding:6px 4px;border-bottom:1px solid #23262f;vertical-align:top;}
table.info td.day{font-weight:700;white-space:nowrap;color:var(--accent2);}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>
<script>
(function(){
"use strict";
function I(t,url){return {t:t,url:url};}
const PHASES=[
 {id:"p0",label:"Setup",short:"Setup & Baseline",kind:"setup"},
 {id:"p1",label:"Beginner",short:"Levels 1–2",target:3,testReq:2,
   concept:[I("Alt Picking Pt.1","https://tinyurl.com/2na6k9kj"),I("Sweep Picking Guide","https://tinyurl.com/2p94rrf2"),I("Economy Picking Guide","https://tinyurl.com/bdfs3ptn"),I("Arpeggio Masterclass","https://tinyurl.com/57t8dup4")],
   exercises:[I("Simple Alt Picking Exercise","https://tinyurl.com/4zckb2nt"),I("Melodic vs Shred Soloing (melodic)","https://tinyurl.com/4mttk257"),I("Simple vs Complex Soloing (simple)","https://tinyurl.com/yd3pumbx"),I("Tornado Of Souls (simplified)","https://tinyurl.com/mpaes6yj")],
   songs:[I("Psycho","https://tinyurl.com/4hy7vacm"),I("Paranoid","https://tinyurl.com/aa5u3azt"),I("Ace Of Spades","https://tinyurl.com/ydkwndkb"),I("Heartwork","https://tinyurl.com/3wbrb8vs"),I("Fade To Black","https://tinyurl.com/yja86djw")]},
 {id:"p2",label:"Intermediate",short:"Level 3",target:6,testReq:3,
   concept:[I("Alt Picking Pt.2","https://tinyurl.com/3yj5fw7n"),I("Pick-Slanting Masterclass","http://tinyurl.com/yppc9rsk"),I("Hand Sync Masterclass","https://tinyurl.com/yc8kkmvr"),I("Vibrato Masterclass","https://tinyurl.com/35vrckd8")],
   exercises:[I("Alt Picking Endurance Test","https://tinyurl.com/ykvr6ay4"),I("ABBA Neoclassical (solo)","https://tinyurl.com/5n7fftb4"),I("Ultimate Bending Workout","https://tinyurl.com/5yn8yzw5"),I("Intermediate Challenge","https://tinyurl.com/yvdf8han")],
   songs:[I("Crystal Mountain","http://tinyurl.com/yth44h56"),I("Bed Of Razors","https://tinyurl.com/522r8529"),I("The Trooper","https://tinyurl.com/2fz9ktbr"),I("Electric Crown","https://tinyurl.com/3x2kwpwn"),I("Mr Crowley","https://tinyurl.com/29v67k8r")]},
 {id:"p3",label:"Advanced",short:"Level 4",target:8,testReq:4,
   concept:[I("Picking Speed Builder","https://tinyurl.com/bdpzvn69"),I("Sweeping Speed Builder","https://tinyurl.com/4cxbx9nw"),I("Hand Strength Builder","https://tinyurl.com/d6237w33"),I("Speed Picking Hack","https://tinyurl.com/y2pfv5vx")],
   exercises:[I("10 Sick Neoclassical Licks","https://tinyurl.com/3rhfwuzr"),I("Eruption Sweeping Workout","http://tinyurl.com/yy5jv45v"),I("20 Scales In 1 Solo","https://tinyurl.com/43924kfz"),I("Melodic vs Shred Soloing (shred)","https://tinyurl.com/4mttk257"),I("Simple vs Complex Soloing (complex)","https://tinyurl.com/yd3pumbx")],
   songs:[I("Hail To The King","https://tinyurl.com/4zjmkpxz"),I("Bark At The Moon","https://tinyurl.com/4p4vwebc"),I("Play With Me","https://tinyurl.com/ykhckrvf"),I("Domination","https://tinyurl.com/3atm4xdd"),I("Tornado Of Souls","https://tinyurl.com/52s7ape4")]},
 {id:"p4",label:"Pro",short:"Level 5",target:10,testReq:5,concept:[],
   exercises:[I("Heavenly Arpeggios","https://tinyurl.com/27ha3u7z"),I("Ultimate Soloing Challenge","https://tinyurl.com/432hkhmp"),I("Quintuplets Workout","https://tinyurl.com/5n7psubr"),I("Thrash Metal Workout","https://tinyurl.com/57f7e6nc"),I("Ultimate Neoclassical Workout","https://tinyurl.com/5a4n28wm"),I("Serrana Arpeggios","https://tinyurl.com/2z4m6c49")],
   songs:[I("Sea Of Lies","https://tinyurl.com/3v4u8jca"),I("Kissing The Shadows","https://tinyurl.com/yyzf6bp7"),I("Under A Glass Moon","https://tinyurl.com/yh3k2j3x"),I("Winter Madness","https://tinyurl.com/mupsw5u3"),I("Nobody","https://tinyurl.com/4uak28u2"),I("Dawn Of The Dragonstar","https://tinyurl.com/3yvsmm3f")]}
];
const CREATIVE={
 songwriting:[I("Riff Writing Masterclass","https://tinyurl.com/59wr7y4x"),I("Solo Writing Masterclass","https://tinyurl.com/ym69pkmv"),I("Metal Songwriting Masterclass","https://tinyurl.com/45du76rt"),I("Harmonize Guitars","https://tinyurl.com/dkds5aey")],
 production:[I("Guitar Transcribing","https://tinyurl.com/2t3d6n4p"),I("Home Recording Guide","https://tinyurl.com/nfkp288a"),I("MIDI Drums","http://tinyurl.com/23uj5xd9"),I("Mixing Guide","https://tinyurl.com/3ujtsn7f")]
};
const PHASE_BLURB={p0:"Get the prerequisites and warm-up in place, then run the baseline test for your own tracking — you start at Phase 1 regardless of the result.",
 p1:"Foundational technique — alternate picking, sweep picking and economy picking form the backbone everything later builds on.",
 p2:"Endurance, precision and expressive control (vibrato, bending). Fundamentals are assumed solid by now.",
 p3:"Raw speed and dexterity get built on purpose here. Expect this tier to take real patience.",
 p4:"The toughest material in the Roadmap. Completing it clears the entire BHGS technique curriculum."};
const CHOP=[{key:"alt",label:"10 Levels Of Alternate Picking",url:"https://tinyurl.com/4anrfje9"},{key:"sweep",label:"10 Levels Of Sweep Picking",url:"https://tinyurl.com/nzcv65ux"},{key:"legato",label:"10 Levels Of Legato",url:"https://tinyurl.com/54fc68fm"},{key:"econ",label:"10 Levels Of Economy Picking",url:"https://tinyurl.com/3v5xt6ne"},{key:"tap",label:"10 Levels Of Tapping",url:"https://tinyurl.com/yw4ex5ma"}];
const TESTCATS=[{key:"alt",label:"Alternate Picking",url:"https://tinyurl.com/yacufunh"},{key:"sweep",label:"Sweep Picking",url:"https://tinyurl.com/bdcr5cxj"},{key:"legato",label:"Legato",url:"https://tinyurl.com/3dh7ec3v"},{key:"tap",label:"Tapping",url:"https://tinyurl.com/yv89y98j"},{key:"econ",label:"Economy Picking",url:"https://tinyurl.com/37nbdr6f"}];
const THEORY=[{t:"Scales Handbook",doc:true,url:"https://tinyurl.com/zx29e8sn"},{t:"Ear Training Pt.1",url:"https://tinyurl.com/ycxndyxn"},{t:"Ear Training Pt.2",url:"https://tinyurl.com/2vexwxsr"},{t:"Modes Course",url:"https://tinyurl.com/5n7p9d92"},{t:"Soloing Over Chord Changes Pt.1",url:"http://tinyurl.com/4zb3dp48"},{t:"Soloing Over Chord Changes Pt.2",url:"https://tinyurl.com/4cm982ta"},{t:"Phrasing Masterclass",url:"https://tinyurl.com/478mfx4v"}];
const ESSENTIAL={Mon:"Ear Training",Tue:"Rhythm",Wed:"Time Signatures",Thu:"Sight-Reading",Fri:"Reinforce Weakest"};
const ESSENTIAL_URL={"Ear Training":"https://tinyurl.com/mu6ka36m","Rhythm":"https://tinyurl.com/2mt96kef","Time Signatures":"https://tinyurl.com/76hdskpt","Sight-Reading":"https://tinyurl.com/2xdf6ky2"};
const BONUS=[I("10 Levels Of Metal Licks","https://tinyurl.com/sz8nkke9"),I("5 Levels Of Pentatonics","https://tinyurl.com/mr2s63ac"),I("Official Lick Pack","https://tinyurl.com/52tb79xt"),I("10 Levels Of Guitar Solo","https://tinyurl.com/4ue66ax9"),I("Hybrid Picking Workout","https://tinyurl.com/5n6pp7kc"),I("Play Like 10 Iconic Shredders","https://tinyurl.com/2p8u4wfh"),I("Whammy Bar Workout","https://tinyurl.com/se8e6act")];
const PREREQ=[{t:"Learn The Fretboard",url:"http://tinyurl.com/43r5c8v7"},{t:"Ultimate Guide To Practising",url:"https://tinyurl.com/dn8f7sm9"},{t:"Music Theory Cheat Sheet",doc:true,url:"https://tinyurl.com/rhyav3wv"}];
const WARMUP_URL="https://tinyurl.com/3zdum9xb";
const RETEST_URL="https://tinyurl.com/yb7u3nsj";
const WEEKLY_RHYTHM=[
 {day:"Mon",focused:"Concept video + exercises in rotation + 5-min Ear Training micro-dose",casual:"Current solo, in order"},
 {day:"Tue",focused:"Exercises in rotation + chop-builders (picking) + 5-min Rhythm micro-dose",casual:"Riff writing / improv"},
 {day:"Wed",focused:"Theory — next linear step + 5-min Time Signatures micro-dose",casual:"Apply theory on the fretboard"},
 {day:"Thu",focused:"Chop-builders (legato/economy/tapping) + 5-min Sight-Reading micro-dose",casual:"Continue current solo"},
 {day:"Fri",focused:"Revisit hardest exercise + reinforce weakest skill",casual:"Free jam"},
 {day:"Sat",focused:"—",casual:"Deep-dive: polish current solo / writing session (45 min)"},
 {day:"Sun",focused:"—",casual:"Improv, bonus drill, or catch-up (45 min)"}
];
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAY_ORDER=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const STORAGE_KEY="shredRoadmapState_v3";

function defaultState(){return {phaseIndex:0,chop:{alt:0,sweep:0,legato:0,econ:0,tap:0},testLevel:{alt:0,sweep:0,legato:0,econ:0,tap:0},checks:{},practiced:{},practicedDate:null,blockPracticed:{},streakDates:[]};}
function loadState(){try{var raw=localStorage.getItem(STORAGE_KEY);if(raw){var d=JSON.parse(raw);return Object.assign(defaultState(),d,{chop:Object.assign(defaultState().chop,d.chop||{}),testLevel:Object.assign(defaultState().testLevel,d.testLevel||{}),checks:d.checks||{},practiced:d.practiced||{},blockPracticed:d.blockPracticed||{},streakDates:d.streakDates||[]});}}catch(e){}return defaultState();}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}

let state=loadState();
let ui={view:"home",lib:{},dayOverride:null,surprise:null};

function k(){return Array.prototype.slice.call(arguments).join(".");}
function todayISO(){return new Date().toISOString().slice(0,10);}
function todayName(){return DAYS[new Date().getDay()];}
function isWeekendDay(d){return d==="Sat"||d==="Sun";}

function ensureDailyReset(){
  var t=todayISO();
  if(state.practicedDate!==t){ state.practiced={}; state.practicedDate=t; saveState(); }
}

function itemKeysForPhase(idx){
  var p=PHASES[idx];
  if(p.kind==="setup"){
    var ks=[]; PREREQ.forEach(function(pr,i){if(!pr.doc) ks.push(k("p0","pre",i));});
    return {keys:ks,chopTarget:null,testReq:null};
  }
  var ks3=[];
  (p.concept||[]).forEach(function(_,i){ks3.push(k(p.id,"c",i));});
  p.exercises.forEach(function(_,i){ks3.push(k(p.id,"e",i));});
  p.songs.forEach(function(_,i){ks3.push(k(p.id,"s",i));});
  return {keys:ks3,chopTarget:p.target,testReq:p.testReq};
}
function phasePercent(idx){
  if(idx<state.phaseIndex) return 100;
  if(idx>state.phaseIndex) return 0;
  var info=itemKeysForPhase(idx);
  var total=info.keys.length+(info.chopTarget?5:0)+(info.testReq?5:0);
  var done=info.keys.filter(function(kk){return !!state.checks[kk];}).length;
  if(info.chopTarget) done+=CHOP.filter(function(c){return state.chop[c.key]>=info.chopTarget;}).length;
  if(info.testReq) done+=TESTCATS.filter(function(c){return state.testLevel[c.key]>=info.testReq;}).length;
  return total?Math.round(done/total*100):0;
}
function nextUnchecked(list,prefix){for(var i=0;i<list.length;i++){if(!state.checks[prefix+"."+i]) return i;}return -1;}
function totalStreak(){return (state.streakDates||[]).length;}
function logToday(){var t=todayISO();if(state.streakDates.indexOf(t)===-1) state.streakDates.push(t);}

function applyStateChange(){
  ensureDailyReset();
  logToday();
  var idx=state.phaseIndex;
  if(idx<PHASES.length-1 && phasePercent(idx)===100){ state.phaseIndex=idx+1; showToast("🔥 Phase unlocked: "+PHASES[idx+1].label+"!"); }
  saveState(); render();
}
function toggleCheck(key){ state.checks[key]=!state.checks[key]; applyStateChange(); }
function togglePracticed(key){ ensureDailyReset(); state.practiced[key]=!state.practiced[key]; applyStateChange(); }
function setChop(sk,d){ state.chop[sk]=Math.max(0,Math.min(10,(state.chop[sk]||0)+d)); applyStateChange(); }
function setTest(sk,d){ state.testLevel[sk]=Math.max(0,Math.min(5,(state.testLevel[sk]||0)+d)); applyStateChange(); }
function setPhaseIndex(idx){ state.phaseIndex=idx; applyStateChange(); showToast("Now on "+PHASES[idx].label); }
function blockKeyFor(name){ return todayISO()+"."+name; }
function isBlockDone(name){ return !!state.blockPracticed[blockKeyFor(name)]; }
function toggleBlockDone(name){ var kk=blockKeyFor(name); state.blockPracticed[kk]=!state.blockPracticed[kk]; applyStateChange(); }

function showToast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(showToast._h);showToast._h=setTimeout(function(){t.classList.remove("show");},2200);}

/* ---------- backup / reset ---------- */
function exportState(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a"); a.href=url; a.download="shred-roadmap-progress.json"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function triggerImport(){ document.getElementById("importFile").click(); }
function handleImportFile(file){
  var reader=new FileReader();
  reader.onload=function(e){
    try{ var data=JSON.parse(e.target.result); state=Object.assign(defaultState(),data); saveState(); render(); showToast("Progress imported!"); }
    catch(err){ showToast("That file couldn't be read."); }
  };
  reader.readAsText(file);
}
function handleReset(){
  if(!confirm("This permanently deletes ALL your progress across every phase — checklists, chop levels, test levels, streaks. This cannot be undone.\n\nContinue?")) return;
  var val=prompt('Type RESET (all caps) to confirm:');
  if(val==="RESET"){ localStorage.removeItem(STORAGE_KEY); state=defaultState(); render(); showToast("Everything has been reset."); }
  else { showToast("Reset cancelled — nothing changed."); }
}

/* ---------- render helpers ---------- */
function linked(label,url){ return url? '<a href="'+url+'" target="_blank" rel="noopener">'+label+'</a>' : label; }
function checkItem(label,key,url){ var c=!!state.checks[key]; return '<li data-toggle="'+key+'"><div class="box'+(c?" on":"")+'"></div><div class="itxt'+(c?" done":"")+'">'+linked(label,url)+'</div></li>'; }
function docItem(label,url){ return '<li class="docli"><div class="docic">📖</div><div class="itxt">'+linked(label,url)+'</div></li>'; }
function dualItem(label,key,url){
  var pr=!!state.practiced[key], ma=!!state.checks[key];
  var practicedBtn = ma? '' : '<button class="dchip pr'+(pr?" on":"")+'" data-action="togp" data-key="'+key+'">'+(pr?"✓ ":"")+'Practiced</button>';
  return '<li class="duali"><div class="itxt'+(ma?" done":"")+'">'+linked(label,url)+'</div><div class="dgroup">'+
    practicedBtn+
    '<button class="dchip ma'+(ma?" on":"")+'" data-action="togm" data-key="'+key+'">'+(ma?"✓ ":"")+'Mastered</button>'+
    '</div></li>';
}
function unmasteredItems(list,prefix){
  var out=[];
  list.forEach(function(item,i){ var kk=prefix+"."+i; if(!state.checks[kk]) out.push(dualItem(item.t,kk,item.url)); });
  return out;
}
function chopRow(target,onlyKeys){
  var list=onlyKeys?CHOP.filter(function(c){return onlyKeys.indexOf(c.key)!==-1;}):CHOP;
  return list.map(function(c){
    var lvl=state.chop[c.key]||0,hit=target&&lvl>=target;
    return '<div class="chop"><div class="nm">'+linked(c.label,c.url)+(target?'<b>target: Level '+target+'</b>':'<b>lifetime level</b>')+'</div><div class="stepper">'+
      '<button data-action="chop" data-t="'+c.key+'" data-d="-1">–</button><div class="lvl'+(hit?" hit":"")+'">'+lvl+(target?"/"+target:"/10")+'</div>'+
      '<button data-action="chop" data-t="'+c.key+'" data-d="1">+</button></div></div>';
  }).join("");
}
function testRow(req){
  return TESTCATS.map(function(c){
    var lvl=state.testLevel[c.key]||0,hit=req&&lvl>=req;
    return '<div class="chop"><div class="nm">'+linked(c.label,c.url)+' <span class="tag">(1-Min Test)</span>'+(req?'<b>need: Level '+req+'</b>':'<b>baseline</b>')+'</div><div class="stepper">'+
      '<button data-action="test" data-t="'+c.key+'" data-d="-1">–</button><div class="lvl'+(hit?" hit":"")+'">'+lvl+'/5</div>'+
      '<button data-action="test" data-t="'+c.key+'" data-d="1">+</button></div></div>';
  }).join("");
}
function progressBar(){
  var segs="",labels="";
  PHASES.forEach(function(p,i){
    var pct=phasePercent(i);
    segs+='<div class="pseg"><i style="width:'+pct+'%"></i></div>';
    labels+='<span class="'+(i===state.phaseIndex?"cur":"")+'">Phase '+i+'</span>';
  });
  return '<div class="phasebar">'+segs+'</div><div class="plabels">'+labels+'</div>';
}
function dayPicker(activeDay){
  var today=todayName();
  return '<div class="daypick">'+DAY_ORDER.map(function(d){
    return '<button class="dchip2'+(d===activeDay?" on":"")+(d===today?" istoday":"")+'" data-action="setday" data-day="'+d+'">'+d+'</button>';
  }).join("")+'</div>';
}
function markRow(blockName,label){
  if(!blockName) return "";
  var done=isBlockDone(blockName);
  return '<ul class="check markrow"><li data-action="blockdone" data-block="'+blockName+'"><div class="box'+(done?" on":"")+'" style="transform:scale(.8);"></div><div class="itxt">Mark '+label+' practiced today</div></li></ul>';
}
function blk(name,title,minText,bodyHtml,trackToday){
  var done = trackToday && isBlockDone(name);
  return '<div class="blk'+(done?" done-today":"")+'"><div class="top"><div class="nm">'+title+'</div>'+(minText?'<div class="min">'+minText+'</div>':'')+'</div>'+bodyHtml+(trackToday?markRow(name,title):"")+'</div>';
}

  html+='<button class="navbtn info" data-action="go" data-view="info"><div class="ic">ℹ️</div><div><b>Guide &amp; Info</b><span>Weekly rhythm, all phases, essential skills</span></div></button>';

  PHASES.forEach(function(p,i){html+='<option value="'+i+'"'+(i===state.phaseIndex?" selected":"")+'>Phase '+i+' — '+p.label+" ("+p.short+')</option>';});

function renderDaily(){
  var idx=state.phaseIndex,p=PHASES[idx];
  var day=ui.dayOverride||todayName();
  var wknd=isWeekendDay(day);
  var isToday=(day===todayName());
  var html='<div class="eyebrow">'+day+' &middot; '+p.label+'</div>';
  html+=dayPicker(day);

  if(p.kind==="setup"){
    var preBody='<ul class="check">'+PREREQ.map(function(pr,i){return pr.doc?docItem(pr.t,pr.url):checkItem(pr.t,k("p0","pre",i),pr.url);}).join("")+'</ul>';
    html+=blk("prereq","Prerequisites",null,preBody,isToday);
    html+=blk("warmup","Warm-Up",null,'<p>'+linked("Ultimate 5-Minute Warm-Up",WARMUP_URL)+'</p>',isToday);
    html+='<div class="note">Run the Phase Transition Test on Home for your baseline — it\'s informational here, not required to advance.</div>';
    return html;
  }

  if(wknd){
    var nsi=nextUnchecked(p.songs,p.id+".s");
    html+=blk("warmup","Warm-Up","15 min",'<p>'+linked("Extended warm-up + weak-spot review",WARMUP_URL)+'</p>',isToday);
    if(day==="Sat"){
      var body='<p>Deep-dive: polish '+(nsi>=0?'"'+p.songs[nsi].t+'"':"your current solo")+' toward full tempo.</p>'+
        (nsi>=0?'<ul class="check">'+dualItem(p.songs[nsi].t,k(p.id,"s",nsi),p.songs[nsi].url)+'</ul>':'');
      html+=blk("casual","Creative","45 min",body,isToday);
    } else {
      html+=blk("casual","Creative","45 min",'<p>Improv over a backing track, or pick a bonus drill.</p><button class="tbtn" data-action="go" data-view="free">Open Free Practice →</button>',isToday);
    }
    return html;
  }

  var ci=nextUnchecked((p.concept||[]).map(function(c){return c.t;}),p.id+".c");
  var si=nextUnchecked(p.songs.map(function(s){return s.t;}),p.id+".s");
  var ti=-1; for(var i=0;i<THEORY.length;i++){ if(!THEORY[i].doc && !state.checks["theory."+i]){ti=i;break;} }
  var essential=ESSENTIAL[day]||"Reinforce Weakest";
  var essUrl=ESSENTIAL_URL[essential];

  html+=blk("warmup","Warm-Up","5 min",'<p>'+linked("Ultimate 5-Minute Warm-Up",WARMUP_URL)+'</p>',isToday);

  var focusBody='';
  if(day==="Mon"){
    if(p.concept&&p.concept.length){ focusBody+= ci>=0 ? '<ul class="check">'+checkItem("Watch: "+p.concept[ci].t,k(p.id,"c",ci),p.concept[ci].url)+'</ul>' : '<p>All concept videos done.</p>'; }
    var exList=unmasteredItems(p.exercises,p.id+".e");
    focusBody += exList.length ? '<p style="margin-top:6px;">Exercises in rotation (Mastered when it\'s solid at tempo):</p><ul class="check">'+exList.join("")+'</ul>' : '<p style="margin-top:6px;">All exercises for this phase mastered.</p>';
  } else if(day==="Tue"){
    var exList2=unmasteredItems(p.exercises,p.id+".e");
    focusBody += exList2.length ? '<ul class="check">'+exList2.join("")+'</ul>' : '<p>All exercises for this phase mastered.</p>';
    focusBody+='<p style="margin:6px 0;">Chop-builders (picking) — protect ~15 min:</p>'+chopRow(p.target,["alt","sweep"]);
  } else if(day==="Wed"){
    focusBody+= ti>=0 ? '<ul class="check">'+checkItem("Theory: "+THEORY[ti].t,k("theory",ti),THEORY[ti].url)+'</ul>' : '<p>Theory track complete.</p>';
  } else if(day==="Thu"){
    focusBody+='<p style="margin-bottom:6px;">Chop-builders (legato/economy/tapping):</p>'+chopRow(p.target,["legato","econ","tap"]);
  } else if(day==="Fri"){
    focusBody+='<p>Revisit your hardest exercise or chop-builder from the week, then reinforce <b style="color:var(--text)">'+linked(essential,essUrl)+'</b> — whichever skill felt weakest.</p>';
    if(p.testReq){
      var met=TESTCATS.filter(function(c){return (state.testLevel[c.key]||0)>=p.testReq;}).length;
      focusBody+='<div class="note" style="margin-top:8px;">Phase Transition Test: '+met+'/5 at Level '+p.testReq+'+. <button class="tbtn" data-action="go" data-view="home" style="margin-top:6px;display:block;">Open Test on Home →</button></div>';
    }
  }
  focusBody+='<p style="margin-top:8px;color:var(--blue);">+ 5 min: '+linked(essential+" micro-dose",essUrl)+'</p>';
  html+=blk("focused","Focused","30 + 5 min",focusBody,isToday);

  var casualBody='';
  if(day==="Mon"||day==="Thu"){ casualBody += si>=0 ? '<ul class="check">'+dualItem(p.songs[si].t,k(p.id,"s",si),p.songs[si].url)+'</ul>' : '<p>All this tier\'s solos learned 🎸</p>'; }
  else if(day==="Tue"){ casualBody+='<p>Riff writing / improv over a backing track</p>'; }
  else if(day==="Wed"){ casualBody+='<p>Apply today\'s theory concept on the fretboard</p>'; }
  else if(day==="Fri"){ casualBody+='<p>Free jam using everything from the week</p>'; }
  html+=blk("casual","Casual","15 min",casualBody,isToday);
  html+=blk("cooldown","Cool-Down","5 min",'<p>Quick review — what clicked, what didn\'t, tempo notes.</p>',isToday);
  return html;
}

function render(){
  ensureDailyReset();
  var root=document.getElementById("root");
  var body='<div class="topbar"><div class="brand">THE SHRED <span>ROADMAP</span></div>'+progressBar()+'</div><div class="page">';
  if(ui.view==="home") body+=renderHome();
  else if(ui.view==="daily") body+=renderDaily();
  else if(ui.view==="library") body+=renderLibrary();
  else if(ui.view==="free") body+=renderFree();
  else if(ui.view==="info") body+=renderInfo();
  body+='</div><div class="botnav">'+navBtn("home","🏠","Home")+navBtn("daily","🎯","Daily")+navBtn("library","📚","Library")+navBtn("free","🎸","Free")+navBtn("info","ℹ️","Info")+'</div>';
  root.innerHTML=body;
  var fi=document.getElementById("importFile");
  if(fi) fi.addEventListener("change",function(e){ if(e.target.files[0]) handleImportFile(e.target.files[0]); });
}
function navBtn(view,ic,label){ return '<button data-action="go" data-view="'+view+'" class="'+(ui.view===view?"active":"")+'"><span class="ic">'+ic+'</span>'+label+'</button>'; }

document.addEventListener("click",function(e){
  if(e.target.closest("a")) return;
  var t=e.target.closest("[data-action],[data-toggle]");
  if(!t) return;
  if(t.dataset.toggle){ toggleCheck(t.dataset.toggle); return; }
  var a=t.dataset.action;
  if(a==="go"){
    if(t.dataset.view!==ui.view){ ui.lib={}; ui.dayOverride=null; ui.surprise=null; }
    ui.view=t.dataset.view; render();
  }
  else if(a==="toggleacc"){ui.lib[t.dataset.acc]=!ui.lib[t.dataset.acc]; render();}
  else if(a==="setday"){ ui.dayOverride=t.dataset.day; render(); }
  else if(a==="togp"){ togglePracticed(t.dataset.key); }
  else if(a==="togm"){ toggleCheck(t.dataset.key); }
  else if(a==="chop"){ setChop(t.dataset.t,parseInt(t.dataset.d,10)); }
  else if(a==="test"){ setTest(t.dataset.t,parseInt(t.dataset.d,10)); }
  else if(a==="blockdone"){ toggleBlockDone(t.dataset.block); }
  else if(a==="surprise"){var pool=BONUS.map(function(b){return b.t;}).concat(Object.keys(ESSENTIAL).map(function(d){return ESSENTIAL[d]+" essential-skill drill";})); ui.surprise=pool[Math.floor(Math.random()*pool.length)]; render();}
  else if(a==="export"){ exportState(); }
  else if(a==="import"){ triggerImport(); }
  else if(a==="reset"){ handleReset(); }
});
document.addEventListener("change",function(e){
  if(e.target.dataset.action==="setphase") setPhaseIndex(parseInt(e.target.value,10));
});

ensureDailyReset();
render();
})();
</script>
</body>
